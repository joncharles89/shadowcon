<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Test Email – ShadowCon</title>
    <link rel="stylesheet" href="/css/styles.css">
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16x16.png">
    <link rel="manifest" href="/icons/site.webmanifest">
    <link rel="mask-icon" href="/icons/safari-pinned-tab.svg" color="#c9a86a">
    <link rel="shortcut icon" href="/icons/favicon.ico">

    <meta name="msapplication-TileColor" content="#111111">
    <meta name="msapplication-config" content="/icons/browserconfig.xml">
    <meta name="theme-color" content="#111111">

    <style>
        .test-container {
            max-width: 420px;
            margin: 80px auto;
            background: #111;
            border: 1px solid rgba(199,169,107,0.3);
            padding: 30px;
            border-radius: 6px;
            box-shadow: 0 0 20px rgba(0,0,0,0.6);
        }

        .test-container h1 {
            text-align: center;
            margin-bottom: 20px;
        }

        .test-container label {
            display: block;
            margin-bottom: 6px;
            color: #c7a96b;
            font-family: "Cinzel", serif;
            letter-spacing: 0.08em;
        }

        .test-container input {
            width: 100%;
            padding: 10px;
            margin-bottom: 18px;
            border: 1px solid rgba(199,169,107,0.3);
            background: #0f0f0f;
            color: #e2dfd7;
            border-radius: 4px;
        }

        .test-container .btn {
            width: 100%;
            text-align: center;
        }

        .test-message {
            margin-top: 16px;
            text-align: center;
            color: #c7a96b;
            font-size: 0.95rem;
        }
    </style>
</head>

<body>

    <div id="nav-placeholder"></div>
    <script type="module" src="/js/nav.js"></script>

    <!-- Test Email Logic -->
    <script type="module">
        import { supabase } from '/js/supabaseClient.js';

        const btn = document.getElementById('testEmailBtn');
        const msg = document.getElementById('testMessage');

        btn.addEventListener('click', async () => {
            msg.textContent = "Sending email...";

            const email = document.getElementById('email').value.trim();

            const { data, error } = await supabase.auth.resetPasswordForEmail(email);

            if (error) {
                msg.textContent = error.message;
                msg.style.color = "#c76b6b"; // soft red
            } else {
                msg.textContent = "Email sent! Check your inbox.";
                msg.style.color = "#c7a96b";
            }
        });

        console.log("Supabase client:", supabase);
    </script>

    <div class="content">
        <div class="test-container">
            <h1>Test SMTP Email</h1>

            <label for="email">Your Email</label>
            <input id="email" type="email" placeholder="you@example.com">

            <button class="btn" id="testEmailBtn">Send Reset Password Email</button>

            <div class="test-message" id="testMessage"></div>
        </div>
    </div>

    

</body>
</html>

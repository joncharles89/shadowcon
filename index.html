<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShadowCon - Kalla Reborn</title>
    <link rel="stylesheet" href="css/styles.css">

    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16x16.png">
    <link rel="manifest" href="/icons/site.webmanifest">
    <link rel="mask-icon" href="/icons/safari-pinned-tab.svg" color="#c9a86a">
    <link rel="shortcut icon" href="/icons/favicon.ico">

    <meta name="msapplication-TileColor" content="#111111">
    <meta name="msapplication-config" content="/icons/browserconfig.xml">
    <meta name="theme-color" content="#111111">
</head>

<body>
    <div id="nav-placeholder"></div>
    <script type="module" src="/js/nav.js"></script>

    <header class="header" id="logo-placeholder"></header>
    <header class="header"><img src="/img/2027LogoTextOnly.png" alt="Kalla Reborn Text" class="logo-text"></header>
    
    <!-- Main Content -->
    <main class="content">
        <section id="event-details">
            <div class="video-wrapper">
                <iframe
                    src="https://www.youtube-nocookie.com/embed/kOo4NV4jLjw"
                    title="ShadowCon 2027 Announcement"
                    loading="lazy"
                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                    allowfullscreen>
                </iframe>
            </div>
            <div id="story-container" class="parchment"></div>
        </section>
    </main>

    <div id="layout-end"></div>

    <script src="js/main.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            fetch(`/pages/lore/stories/kalla-prologue.html`)
                .then(response => response.text())
                .then(html => {
                    document.getElementById("story-container").innerHTML = html;
                })
                .catch(() => {
                    document.getElementById("story-container").innerHTML =
                        "<p>Story not found.</p>";
                });
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShadowCon 2027 - Kalla Reborn</title>
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>

    <div id="layout-start"></div>
    <header class="header" id="logo-placeholder"></header>
    <header class="header"><img src="/img/2027LogoTextOnly.png" alt="Kalla Reborn Text" class="logo-text"></header>
    
    <!-- Main Content -->
    <main class="content">
        <section id="event-details">
            <div class="video-wrapper">
                <iframe
                    src="https://www.youtube-nocookie.com/embed/kOo4NV4jLjw"
                    title="ShadowCon 2027 Announcement"
                    loading="lazy"
                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                    allowfullscreen>
                </iframe>
            </div>
            <div id="story-container" class="parchment"></div>
        </section>
    </main>

    <div id="layout-end"></div>

    <script src="js/main.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            fetch(`/pages/lore/stories/kalla-prologue.html`)
                .then(response => response.text())
                .then(html => {
                    document.getElementById("story-container").innerHTML = html;
                })
                .catch(() => {
                    document.getElementById("story-container").innerHTML =
                        "<p>Story not found.</p>";
                });
        });
    </script>
</body>
</html>

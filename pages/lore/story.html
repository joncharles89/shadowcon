<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShadowCon - Lore</title>
    <link rel="stylesheet" href="/css/styles.css">
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16x16.png">
    <link rel="manifest" href="/icons/site.webmanifest">
    <link rel="mask-icon" href="/icons/safari-pinned-tab.svg" color="#c9a86a">
    <link rel="shortcut icon" href="/icons/favicon.ico">

    <meta name="msapplication-TileColor" content="#111111">
    <meta name="msapplication-config" content="/icons/browserconfig.xml">
    <meta name="theme-color" content="#111111">
</head>

<body>

    <div id="layout-start"></div>

    <!-- Main Content -->
    <main class="content">
        <a href="/pages/lore.html" class="back-button">← Back to Lore</a>
        <div id="story-container" class="parchment"></div>
    </main>

    <div id="layout-end"></div>

    <script src="/js/main.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const params = new URLSearchParams(window.location.search);
            const storyId = params.get("id");

            if (!storyId) return;

            fetch(`/pages/lore/stories/${storyId}.html`)
                .then(response => response.text())
                .then(html => {
                    document.getElementById("story-container").innerHTML = html;
                })
                .catch(() => {
                    document.getElementById("story-container").innerHTML =
                        "<p>Story not found.</p>";
                });
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShadowCon - Video</title>
    <link rel="stylesheet" href="/css/styles.css">
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16x16.png">
    <link rel="manifest" href="/icons/site.webmanifest">
    <link rel="mask-icon" href="/icons/safari-pinned-tab.svg" color="#c9a86a">
    <link rel="shortcut icon" href="/icons/favicon.ico">

    <meta name="msapplication-TileColor" content="#111111">
    <meta name="msapplication-config" content="/icons/browserconfig.xml">
    <meta name="theme-color" content="#111111">
</head>

<body>

    <div id="nav-placeholder"></div>
    <script type="module" src="/js/nav.js"></script>

    <!-- Main Content -->
    <main class="content">
        <h1>Video</h1>
        <div class="video-filters">
            <button data-filter="all" class="active">All</button>
            <button data-filter="blackmarketwrath">Black Market Wrath (2024)</button>
            <button data-filter="relicsoftherealms">Relics of the Realms (2025)</button>
            <!-- <button data-filter="kallareborn">Kalla Reborn</button> -->
        </div>
        <div class="video-grid">
            <div class="video-card" data-category="blackmarketwrath">
                <iframe
                    src="https://www.youtube-nocookie.com/embed/nV4n2I3RJyA"
                    title="ShadowCon 2024 Intro"
                    loading="lazy"
                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                    allowfullscreen>
                </iframe>
            </div>

            <div class="video-card" data-category="blackmarketwrath">
                <iframe
                    src="https://www.youtube-nocookie.com/embed/Dh_2vUxq5ic"
                    title="ShadowCon 2024 Midway Warning"
                    loading="lazy"
                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                    allowfullscreen>
                </iframe>
            </div>

            <div class="video-card" data-category="blackmarketwrath">
                <iframe
                    src="https://www.youtube-nocookie.com/embed/X0g4kmkAAj4"
                    title="ShadowCon 2024 Finale"
                    loading="lazy"
                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                    allowfullscreen>
                </iframe>
            </div>

            <div class="video-card" data-category="relicsoftherealms">
                <iframe
                    src="https://www.youtube-nocookie.com/embed/291Jgl5ime4"
                    title="ShadowCon 2025 Intro"
                    loading="lazy"
                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                    allowfullscreen>
                </iframe>
            </div>

            <div class="video-card" data-category="relicsoftherealms">
                <iframe
                    src="https://www.youtube-nocookie.com/embed/dj9H2CxeDSo"
                    title="ShadowCon 2025 Outro"
                    loading="lazy"
                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                    allowfullscreen>
                </iframe>
            </div>
        </div>
    </main>

    <div id="layout-end"></div>

    <script src="/js/main.js"></script>

    <script>
        const filterButtons = document.querySelectorAll(".video-filters button");
        const videoCards = document.querySelectorAll(".video-card");

        filterButtons.forEach(button => {
            button.addEventListener("click", () => {
                const filter = button.getAttribute("data-filter");

                // Update active button styling
                filterButtons.forEach(btn => btn.classList.remove("active"));
                button.classList.add("active");

                videoCards.forEach(card => {
                    const categories = card.getAttribute("data-category").split(" ");

                    if (filter === "all" || categories.includes(filter)) {
                        card.style.display = "flex";
                    } else {
                        card.style.display = "none";
                    }
                });
            });
        });
    </script>
</body>
</html>

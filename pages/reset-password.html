<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShadowCon - Choose New Password</title>
    <link rel="stylesheet" href="/css/styles.css">
    <link rel="stylesheet" href="/css/auth.css">
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16x16.png">
    <link rel="manifest" href="/icons/site.webmanifest">
    <link rel="mask-icon" href="/icons/safari-pinned-tab.svg" color="#c9a86a">
    <link rel="shortcut icon" href="/icons/favicon.ico">

    <meta name="msapplication-TileColor" content="#111111">
    <meta name="msapplication-config" content="/icons/browserconfig.xml">
    <meta name="theme-color" content="#111111">
</head>

<body>
    <main class="content">
        <div class="register-container">
            <h1>Choose a New Password</h1>

            <label for="password">New Password</label>
            <input id="password" type="password" placeholder="••••••••">

            <button class="btn" id="updatePasswordBtn">Update Password</button>

            <div class="register-message" id="resetMessage"></div>
        </div>
    </main>

    <script type="module">
        import { initPasswordResetForm } from '/js/reset-password.js';
        initPasswordResetForm();
    </script>
</body>
</html>

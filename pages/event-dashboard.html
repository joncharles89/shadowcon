<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShadowCon - Event Dashboard</title>
    <link rel="stylesheet" href="/css/styles.css">
    <link rel="stylesheet" href="/css/event-dashboard.css">
    
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16x16.png">
    <link rel="manifest" href="/icons/site.webmanifest">
    <link rel="mask-icon" href="/icons/safari-pinned-tab.svg" color="#c9a86a">
    <link rel="shortcut icon" href="/icons/favicon.ico">

    <meta name="msapplication-TileColor" content="#111111">
    <meta name="msapplication-config" content="/icons/browserconfig.xml">
    <meta name="theme-color" content="#111111">
</head>

<body class="event-dashboard">
    <!-- Main Content Wrapper -->
    <main class="dashboard-content">

        <!-- GLOBAL HEADER -->
        <header class="dashboard-header">
            <h1 id="round-title" class="gold-heading">Round 1</h1>
        </header>

        <!-- PAIRINGS VIEW -->
        <div class="dashboard-root" id="view-pairings">
            <section class="tables-section">
                <div id="tables-container" class="tables-columns"></div>
            </section>

            <section class="bottom-section">
                <div class="swing-scoreboard card" id="swing-scoreboard"></div>
                <div class="timer-block card">
                    <div class="timer-label">Time Remaining</div>
                    <div id="timer" class="timer-value">00:00</div>
                </div>
                <div class="info-box card" id="info-box-bottom-right"></div>
            </section>
        </div>

        <!-- BATTLEPLAN VIEW -->
        <div class="dashboard-root" id="view-battleplan" style="display:none;">
            <div id="battleplan-container"></div>
        </div>

        <!-- MAP VIEW -->
        <div class="dashboard-root" id="view-map" style="display:none;">
            <div class="map-top">
                <img src="/img/map/TempMap.png" alt="World Map" class="map-image">
            </div>
            <div class="map-bottom">
                <div id="map-swing-scoreboard" class="map-swing-scoreboard"></div>
            </div>
        </div>

    </main>

    <!-- Dashboard Logic -->
    <script type="module" src="/js/event-dashboard.js"></script>

</body>
</html>

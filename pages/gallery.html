<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShadowCon - Gallery</title>
    <link rel="stylesheet" href="/css/styles.css">
</head>

<body>

    <div id="nav-placeholder"></div>
    <script type="module" src="/js/nav.js"></script>

    <!-- Main Content -->
    <main class="content">
        <h1>Gallery</h1>
        <div class="gallery-filters">
            <button data-filter="all" class="active">All</button>
            <button data-filter="landscape">Landscapes</button>
            <button data-filter="artifacts">Relics</button>
        </div>

        <div class="gallery">
            <img src="/img/gallery/001.png" alt="Image 1" loading="lazy" data-caption="Image 1" data-category="landscape">
            <img src="/img/gallery/002.png" alt="Image 2" loading="lazy" data-caption="Image 2" data-category="landscape">
            <img src="/img/gallery/003.png" alt="Image 3" loading="lazy" data-caption="Image 3" data-category="landscape">
            <img src="/img/gallery/004.png" alt="Image 4" loading="lazy" data-caption="Image 4" data-category="landscape">
            <img src="/img/gallery/005.png" alt="Image 5" loading="lazy" data-caption="Image 5" data-category="landscape">
            <img src="/img/gallery/006.png" alt="Image 6" loading="lazy" data-caption="Image 6" data-category="landscape">
            <img src="/img/gallery/007.png" alt="Image 7" loading="lazy" data-caption="Image 7" data-category="landscape">
            <img src="/img/gallery/008.png" alt="Image 8" loading="lazy" data-caption="Image 8" data-category="landscape">
            <img src="/img/gallery/009.png" alt="Image 9" loading="lazy" data-caption="Image 9" data-category="landscape">
            <img src="/img/gallery/010.png" alt="Image 10" loading="lazy" data-caption="Image 10" data-category="landscape">
            <img src="/img/gallery/011.jpeg" alt="Image 11" loading="lazy" data-caption="Image 11" data-category="landscape">
            <img src="/img/gallery/012.png" alt="Image 12" loading="lazy" data-caption="Image 12" data-category="landscape">
            <img src="/img/gallery/013.png" alt="Image 13" loading="lazy" data-caption="Image 13" data-category="landscape">
            <img src="/img/gallery/014.png" alt="Image 14" loading="lazy" data-caption="Image 14" data-category="landscape">
            <img src="/img/gallery/015.png" alt="Image 15" loading="lazy" data-caption="Image 15" data-category="landscape">
            <img src="/img/gallery/016.png" alt="Image 16" loading="lazy" data-caption="Image 16" data-category="landscape">
        </div>

    </main>

    <div id="layout-end"></div>

    <script src="/js/main.js"></script>
    <script>
        const galleryFilterButtons = document.querySelectorAll(".gallery-filters button");
        const galleryImages = document.querySelectorAll(".gallery img");

        galleryFilterButtons.forEach(button => {
            button.addEventListener("click", () => {
                const filter = button.getAttribute("data-filter");

                // Update active button styling
                galleryFilterButtons.forEach(btn => btn.classList.remove("active"));
                button.classList.add("active");

                galleryImages.forEach(img => {
                    const categories = img.getAttribute("data-category").split(" ");

                    if (filter === "all" || categories.includes(filter)) {
                        img.style.display = "block";
                    } else {
                        img.style.display = "none";
                    }
                });
            });
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShadowCon - Gallery</title>
    <link rel="stylesheet" href="/css/styles.css">
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16x16.png">
    <link rel="manifest" href="/icons/site.webmanifest">
    <link rel="mask-icon" href="/icons/safari-pinned-tab.svg" color="#c9a86a">
    <link rel="shortcut icon" href="/icons/favicon.ico">

    <meta name="msapplication-TileColor" content="#111111">
    <meta name="msapplication-config" content="/icons/browserconfig.xml">

</head>

<body>

    <div id="nav-placeholder"></div>
    <script type="module" src="/js/nav.js"></script>

    <!-- Main Content -->

            <button data-filter="other">Other</button>
        </div>

            <img src="/img/gallery/landscapes/004.png" alt="The Ascendancy" loading="lazy" data-caption="The Ascendancy" data-category="landscape">
            <img src="/img/gallery/landscapes/005.png" alt="Guttersnipe Alley" loading="lazy" data-caption="Guttersnipe Alley" data-category="landscape">
            <img src="/img/gallery/landscapes/006.png" alt="Griffin's Peak" loading="lazy" data-caption="Griffin's Peak" data-category="landscape">
            <img src="/img/gallery/landscapes/007.png" alt="Emberton Gulch" loading="lazy" data-caption="Emberton Gulch" data-category="landscape">
            <img src="/img/gallery/landscapes/008.png" alt="Bonedust Corral" loading="lazy" data-caption="Bonedust Corral" data-category="landscape">
            <img src="/img/gallery/landscapes/009.png" alt="Surgeon's Rise" loading="lazy" data-caption="Surgeon's Rise" data-category="landscape">
            <img src="/img/gallery/landscapes/010.png" alt="Sixskull Pyre" loading="lazy" data-caption="Sixskull Pyre" data-category="landscape">
            <img src="/img/gallery/landscapes/011.jpeg" alt="Skink's Wallow" loading="lazy" data-caption="Skink's Wallow" data-category="landscape">
            <img src="/img/gallery/landscapes/012.png" alt="Arkanaut's Drift" loading="lazy" data-caption="Arkanaut's Drift" data-category="landscape">
            <img src="/img/gallery/landscapes/013.png" alt="Headman's Rest" loading="lazy" data-caption="Headman's Rest" data-category="landscape">
            <img src="/img/gallery/landscapes/014.png" alt="Hammerstrike" loading="lazy" data-caption="Hammerstrike" data-category="landscape">
            <img src="/img/gallery/landscapes/015.png" alt="Marrow o' the Earth" loading="lazy" data-caption="Marrow o' the Earth" data-category="landscape">
            <img src="/img/gallery/landscapes/016.png" alt="Old Vorsprang's Bridge" loading="lazy" data-caption="Old Vorsprang's Bridge" data-category="landscape">
            <img src="/img/gallery/artefacts/Canis.PNG" alt="Canis" loading="lazy" data-caption="Canis" data-category="artefacts">
            <img src="/img/gallery/artefacts/Ignis.PNG" alt="Ignis" loading="lazy" data-caption="Ignis" data-category="artefacts">
            <img src="/img/gallery/artefacts/Kalla.PNG" alt="Kalla" loading="lazy" data-caption="Kalla" data-category="artefacts">
            <img src="/img/gallery/artefacts/Lumis.PNG" alt="Lumis" loading="lazy" data-caption="Lumis" data-category="artefacts">
            <img src="/img/gallery/artefacts/Mortis.PNG" alt="Mortis" loading="lazy" data-caption="Mortis" data-category="artefacts">
            <img src="/img/gallery/artefacts/Sombra.PNG" alt="Sombra" loading="lazy" data-caption="Sombra" data-category="artefacts">
            <img src="/img/gallery/artefacts/Tirra.PNG" alt="Tirra" loading="lazy" data-caption="Tirra" data-category="artefacts">
            <img src="/img/gallery/artefacts/Umbra.PNG" alt="Umbra" loading="lazy" data-caption="Umbra" data-category="artefacts">
            <img src="/img/gallery/artefacts/Vita.PNG" alt="Vita" loading="lazy" data-caption="Vita" data-category="artefacts">
            <img src="/img/gallery/guardians/Canis.PNG" alt="Canis" loading="lazy" data-caption="Canis" data-category="guardians">
            <img src="/img/gallery/guardians/Ignis.PNG" alt="Ignis" loading="lazy" data-caption="Ignis" data-category="guardians">
            <img src="/img/gallery/guardians/Lumis.PNG" alt="Lumis" loading="lazy" data-caption="Lumis" data-category="guardians">
            <img src="/img/gallery/guardians/Mortis.PNG" alt="Mortis" loading="lazy" data-caption="Mortis" data-category="guardians">
            <img src="/img/gallery/guardians/Tirra and Vita.PNG" alt="Tirra and Vita" loading="lazy" data-caption="Tirra and Vita" data-category="guardians">
            <img src="/img/gallery/guardians/Umbra Sombra Kalla.PNG" alt="Umbra, Sombra and Kalla" loading="lazy" data-caption="Umbra, Sombra and Kalla" data-category="guardians">
            <img src="/img/gallery/other/pantheon.png" alt="Pantheon" loading="lazy" data-caption="Pantheon of the Gods" data-category="other">
        </div>

    </main>

    <div id="layout-end"></div>

    <script src="/js/main.js"></script>
    <script>
        const galleryFilterButtons = document.querySelectorAll(".gallery-filters button");
        const galleryImages = document.querySelectorAll(".gallery img");

        galleryFilterButtons.forEach(button => {
            button.addEventListener("click", () => {
                const filter = button.getAttribute("data-filter");

                // Update active button styling
                galleryFilterButtons.forEach(btn => btn.classList.remove("active"));
                button.classList.add("active");

                galleryImages.forEach(img => {
                    const categories = img.getAttribute("data-category").split(" ");

                    if (filter === "all" || categories.includes(filter)) {
                        img.style.display = "block";
                    } else {
                        img.style.display = "none";
                    }
                });
            });
        });
    </script>
</body>
</html>

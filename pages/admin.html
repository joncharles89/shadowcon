<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShadowCon - Admin Dashboard</title>
    <link rel="stylesheet" href="/css/styles.css">
    <link rel="stylesheet" href="/css/admin.css">

    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16x16.png">
    <link rel="manifest" href="/icons/site.webmanifest">
    <link rel="mask-icon" href="/icons/safari-pinned-tab.svg" color="#c9a86a">
    <link rel="shortcut icon" href="/icons/favicon.ico">

    <meta name="msapplication-TileColor" content="#111111">
    <meta name="msapplication-config" content="/icons/browserconfig.xml">
    <meta name="theme-color" content="#111111">
</head>

<body>
    <div id="nav-placeholder"></div>
    <script type="module" src="/js/nav.js"></script>

    <!-- Desktop Sidebar -->
    <nav class="admin-sidebar">
        <div class="admin-sidebar-title">Admin</div>

        <button data-section="pairings" class="admin-nav-item active">Pairings</button>
        <button data-section="teams" class="admin-nav-item">Teams</button>
        <button data-section="players" class="admin-nav-item">Players</button>
        <button data-section="rounds" class="admin-nav-item">Rounds</button>

        <div class="admin-nav-group-title">Voting</div>
        <button data-section="voting-config" class="admin-nav-item">Voting Config</button>
        <button data-section="voting" class="admin-nav-item">Voting Admin</button>

        <div class="admin-nav-group-title">Results</div>
        <button data-section="league" class="admin-nav-item">League Tables</button>
        <a href="/pages/event-dashboard.html?round=1" style="text-decoration: none; color: inherit;">
            <button class="admin-nav-item">Event Dashboard</button>
        </a>
    </nav>

    <!-- Mobile Sub‑Nav -->
    <div class="admin-mobile-nav">
        <button id="adminMobileToggle">Admin Menu ▼</button>

        <div id="adminMobileMenu" class="admin-mobile-menu">
            <button data-section="pairings">Pairings</button>
            <button data-section="teams">Teams</button>
            <button data-section="players">Players</button>
            <button data-section="rounds">Rounds</button>

            <div class="admin-mobile-group">Voting</div>
            <button data-section="voting-config">Voting Config</button>
            <button data-section="voting">Voting Admin</button>

            <div class="admin-mobile-group">Results</div>
            <button data-section="league">League Tables</button>
            <a href="/pages/event-dashboard.html" style="text-decoration: none; color: inherit;">
                <button>Event Dashboard</button>
            </a>
        </div>
    </div>

    <main class="admin-content">
        <h1>Admin Dashboard</h1>

        <div id="admin-content"></div>
    </main>

    <div id="layout-end"></div>

    <!-- Admin logic -->
    <script type="module" src="/js/admin.js"></script>

    <!-- Admin modules -->
    <script type="module" src="/js/admin-pairings.js"></script>
    <script type="module" src="/js/admin-teams.js"></script>
    <script type="module" src="/js/admin-players.js"></script>
    <script type="module" src="/js/admin-rounds.js"></script>
    <script type="module" src="/js/admin-voting.js"></script>
    <script type="module" src="/js/admin-voting-config.js"></script>
    <script type="module" src="/js/admin-league.js"></script>

    <!-- Modal helper -->
    <script type="module" src="/js/admin-modal.js"></script>
</body>
</html>

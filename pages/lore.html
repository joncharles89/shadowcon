<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShadowCon - Lore</title>
    <link rel="stylesheet" href="/css/styles.css">
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16x16.png">
    <link rel="manifest" href="/icons/site.webmanifest">
    <link rel="mask-icon" href="/icons/safari-pinned-tab.svg" color="#c9a86a">
    <link rel="shortcut icon" href="/icons/favicon.ico">

    <meta name="msapplication-TileColor" content="#111111">
    <meta name="msapplication-config" content="/icons/browserconfig.xml">
    <meta name="theme-color" content="#111111">
</head>

<body>

    <div id="nav-placeholder"></div>
    <script type="module" src="/js/nav.js"></script>

    <!-- Main Content -->
    <main class="content">
        <h1>Lore</h1>
        <div class="lore-filters">
            <button data-filter="all" class="active">All</button>
            <button data-filter="relicsoftherealms">Relics of the Realms</button>
            <button data-filter="kallareborn">Kalla Reborn</button>
        </div>

        <div class="lore-grid">
            <a href="/pages/lore/story.html?id=rotr-prologue" class="lore-card" data-category="relicsoftherealms">
                <img src="/img/rotr.svg" alt="Relics of the Realms" class="lore-icon">
                <div class="lore-text">
                    <h3>Relics of the Realms - Prologue</h3>
                    <p>An introduction to our esteemed Emperor.</p>
                </div>
            </a>

            <a href="/pages/lore/story.html?id=rotr-silverknight" class="lore-card" data-category="relicsoftherealms">
                <img src="/img/rotr.svg" alt="Relics of the Realms" class="lore-icon">
                <div class="lore-text">
                    <h3>The Silver Knight</h3>
                    <p>What are the Relics of the Realms?</p>
                </div>
            </a>

            <a href="/pages/lore/story.html?id=rotr-interlude" class="lore-card" data-category="relicsoftherealms">
                <img src="/img/rotr.svg" alt="Relics of the Realms" class="lore-icon">
                <div class="lore-text">
                    <h3>Relics of the Realms - Interlude</h3>
                    <p>The Emperor's plan unfolds.</p>
                </div>
            </a>

            <a href="/pages/lore/story.html?id=rotr-farpointinn" class="lore-card" data-category="relicsoftherealms">
                <img src="/img/rotr.svg" alt="Relics of the Realms" class="lore-icon">
                <div class="lore-text">
                    <h3>Encounter at Farpoint Inn</h3>
                    <p>An old man tells a tale.</p>
                </div>
            </a>

            <a href="/pages/lore/story.html?id=kalla-prologue" class="lore-card" data-category="kallareborn">
                <img src="/img/SwordIcon.svg" alt="Kalla Reborn" class="lore-icon">
                <div class="lore-text">
                    <h3>Kalla Reborn - Prologue</h3>
                    <p>Two years passed...</p>
                </div>
            </a>
        </div>
    </main>

    <div id="layout-end"></div>

    <script src="/js/main.js"></script>
    <script>
        const filterButtons = document.querySelectorAll(".lore-filters button");
        const loreCards = document.querySelectorAll(".lore-card");

        filterButtons.forEach(button => {
            button.addEventListener("click", () => {
                const filter = button.getAttribute("data-filter");

                // Update active button styling
                filterButtons.forEach(btn => btn.classList.remove("active"));
                button.classList.add("active");

                loreCards.forEach(card => {
                    const categories = card.getAttribute("data-category").split(" ");

                    if (filter === "all" || categories.includes(filter)) {
                        card.style.display = "block";
                    } else {
                        card.style.display = "none";
                    }
                });
            });
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShadowCon 2027 - Lore</title>
    <link rel="stylesheet" href="../css/styles.css">
</head>

<body>

    <div id="layout-start"></div>

    <!-- Main Content -->
    <main class="content">
        <h1>Lore</h1>
        <div class="lore-filters">
            <button data-filter="all" class="active">All</button>
            <button data-filter="relicsoftherealms">Relics of the Realms</button>
            <button data-filter="kallareborn">Kalla Reborn</button>
        </div>

        <div class="lore-grid">
            <a href="/pages/lore/story.html?id=rotr-prologue" class="lore-card" data-category="relicsoftherealms">
                <h3>Relics of the Realms - Prologue</h3>
                <p>An introduction to our esteemed Emperor.</p>
            </a>

            <a href="/pages/lore/story.html?id=kalla-reborn" class="lore-card" data-category="kallareborn">
                <h3>Kalla Reborn - Prologue</h3>
                <p>Still to come...</p>
            </a>
        </div>
    </main>

    <div id="layout-end"></div>

    <script src="../js/main.js"></script>
    <script>
        const filterButtons = document.querySelectorAll(".lore-filters button");
        const loreCards = document.querySelectorAll(".lore-card");

        filterButtons.forEach(button => {
            button.addEventListener("click", () => {
                const filter = button.getAttribute("data-filter");

                // Update active button styling
                filterButtons.forEach(btn => btn.classList.remove("active"));
                button.classList.add("active");

                loreCards.forEach(card => {
                    const categories = card.getAttribute("data-category").split(" ");

                    if (filter === "all" || categories.includes(filter)) {
                        card.style.display = "block";
                    } else {
                        card.style.display = "none";
                    }
                });
            });
        });
    </script>
</body>
</html>

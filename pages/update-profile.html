<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShadowCon - Update Profile</title>
    <link rel="stylesheet" href="/css/styles.css">
    <link rel="stylesheet" href="/css/auth.css">
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16x16.png">
    <link rel="manifest" href="/icons/site.webmanifest">
    <link rel="mask-icon" href="/icons/safari-pinned-tab.svg" color="#c9a86a">
    <link rel="shortcut icon" href="/icons/favicon.ico">

    <meta name="msapplication-TileColor" content="#111111">
    <meta name="msapplication-config" content="/icons/browserconfig.xml">
    <meta name="theme-color" content="#111111">
</head>

<body>
    <div id="nav-placeholder"></div>
    <script type="module" src="/js/nav.js"></script>

    <main class="content">
        <div class="profile-container">
            <h1>Update Profile</h1>

            <label for="name">Name</label>
            <input id="name" type="text" placeholder="Your name">

            <label for="army">Army</label>
            <input id="army" type="text" placeholder="Your army">

            <button class="btn" id="saveProfileBtn">Save Profile</button>

            <div class="profile-message" id="profileMessage"></div>

            <p style="text-align:center; margin-top:20px;">
                <a href="/pages/profile.html">Back to Profile</a>
            </p>
        </div>
    </main>

    <div id="layout-end"></div>

    <script src="/js/main.js"></script>

    <script type="module">
        import { supabase } from '/js/supabaseClient.js';
        import { redirectIfLoggedOut } from '/js/auth.js';

        // Prevent access if not logged in
        redirectIfLoggedOut();

        const nameInput = document.getElementById('name');
        const armyInput = document.getElementById('army');
        const saveBtn = document.getElementById('saveProfileBtn');
        const message = document.getElementById('profileMessage');

        async function loadProfile() {
            const { data: { user } } = await supabase.auth.getUser();
            if (!user) return;

            const { data, error } = await supabase
                .from('profiles')
                .select('*')
                .eq('id', user.id)
                .single();

            if (error) {
                message.textContent = "No profile found — create one below.";
                message.style.color = "#c7a96b";
                return;
            }

            nameInput.value = data.name || "";
            armyInput.value = data.army_name || "";
        }

        saveBtn.addEventListener('click', async () => {
            message.textContent = "Saving...";
            message.style.color = "#c7a96b";

            const name = nameInput.value.trim();

            const { data: { user } } = await supabase.auth.getUser();
            if (!user) return;

            const { error } = await supabase
                .from('profiles')
                .upsert({
                    id: user.id,
                    name : nameInput.value,
                    army_name: armyInput.value,
                    updated_at: new Date()
                });

            if (error) {
                message.textContent = error.message;
                message.style.color = "#c76b6b";
            } else {
                message.textContent = "Profile updated!";
                message.style.color = "#c7a96b";
            }
        });

        loadProfile();
    </script>
</body>
</html>

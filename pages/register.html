<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShadowCon - Register</title>
    <link rel="stylesheet" href="/css/styles.css">
    <link rel="stylesheet" href="/css/auth.css">
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16x16.png">
    <link rel="manifest" href="/icons/site.webmanifest">
    <link rel="mask-icon" href="/icons/safari-pinned-tab.svg" color="#c9a86a">
    <link rel="shortcut icon" href="/icons/favicon.ico">

    <meta name="msapplication-TileColor" content="#111111">
    <meta name="msapplication-config" content="/icons/browserconfig.xml">
    <meta name="theme-color" content="#111111">
</head>

<body>

    <div id="nav-placeholder"></div>
    <script type="module" src="/js/nav.js"></script>

    <!-- Main Content -->
    <main class="content">
        <div class="register-container">
            <h1>Create Account</h1>

            <label for="email">Email</label>
            <input id="email" type="email" placeholder="you@example.com">

            <label for="username">Username</label>
            <input id="username" type="text" placeholder="Your username">

            <label for="password">Password</label>
            <input id="password" type="password" placeholder="••••••••">

            <button class="btn" id="registerBtn">Register</button>

            <div class="register-message" id="registerMessage"></div>

            <p style="text-align:center; margin-top:20px;">
                <a href="/pages/login.html">Already have an account?</a>
            </p>
        </div>
    </main>

    <div id="layout-end"></div>

    <script src="/js/main.js"></script>

    <!-- Registration Logic -->
    <script type="module">
        import { initRegisterForm } from '/js/register.js';
        initRegisterForm();

        const usernameInput = document.getElementById('username');
        usernameInput.addEventListener('input', () => {
            usernameInput.value = usernameInput.value.replace(/\s+/g, '');
        });
    </script>
</body>
</html>

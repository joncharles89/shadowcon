<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShadowCon - Login</title>
    <link rel="stylesheet" href="/css/styles.css">
    <link rel="stylesheet" href="/css/auth.css">
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16x16.png">
    <link rel="manifest" href="/icons/site.webmanifest">
    <link rel="mask-icon" href="/icons/safari-pinned-tab.svg" color="#c9a86a">
    <link rel="shortcut icon" href="/icons/favicon.ico">

    <meta name="msapplication-TileColor" content="#111111">
    <meta name="msapplication-config" content="/icons/browserconfig.xml">
    <meta name="theme-color" content="#111111">
</head>

<body>
    
    <div id="nav-placeholder"></div>
    <script type="module" src="/js/nav.js"></script>

    <main class="content">
        <div class="login-container">
            <h1>Login</h1>

            <label for="email">Email</label>
            <input id="email" type="email" placeholder="you@example.com">

            <label for="password">Password</label>
            <div class="password-wrapper">
                <input id="password" type="password" placeholder="••••••••">
                <button type="button" id="togglePassword" class="toggle-password" aria-label="Show password">
                    <span class="eye-icon"></span>
                </button>
            </div>

            <p style="text-align:right; margin:6px 0 12px;">
                <a href="/pages/forgot-password.html" class="forgot-link">Forgot password?</a>
            </p>

            <button class="btn" id="loginBtn">Login</button>

            <div class="login-message" id="loginMessage"></div>

            <p style="text-align:center; margin-top:20px;">
                <a href="/pages/register.html">Create an account</a>
            </p>
        </div>
    </main>

    <div id="layout-end"></div>

    <script src="/js/main.js"></script>

    <script type="module">
        import { supabase } from '/js/supabaseClient.js';
        import { redirectIfLoggedIn } from '/js/auth.js';

        // Prevent logged-in users from seeing the login page
        redirectIfLoggedIn();

        const loginBtn = document.getElementById('loginBtn');
        const loginMessage = document.getElementById('loginMessage');

        loginBtn.addEventListener('click', async () => {
            loginMessage.textContent = "Logging in...";

            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value.trim();

            const { data, error } = await supabase.auth.signInWithPassword({
                email,
                password
            });

            if (error) {
                loginMessage.textContent = error.message;
                loginMessage.style.color = "#c76b6b"; // soft red
            } else {
                loginMessage.textContent = "Login successful!";
                loginMessage.style.color = "#c7a96b";

                setTimeout(() => {
                    window.location.href = "/pages/profile.html";
                }, 800);
            }
        });

        const togglePassword = document.getElementById('togglePassword');
        const passwordInput = document.getElementById('password');
        const eyeIcon = togglePassword.querySelector('.eye-icon');

        togglePassword.addEventListener('click', () => {
            const isPassword = passwordInput.getAttribute('type') === 'password';
            passwordInput.setAttribute('type', isPassword ? 'text' : 'password');
            eyeIcon.classList.toggle('closed', !isPassword);
        });

    </script>

</body>
</html>
